openapi: 3.2.0
info:
  title: Basis Theory Application Templates API
  description: '## Getting Started

    * Sign-in to Basis Theory and go to Applications

    * Create a Basis Theory Private Application

    * All permissions should be selected

    * Paste the API Key into the `BT-API-KEY` variable'
  version: v1
servers:
- url: https://api.basistheory.com
  description: Default
  x-fern-server-name: default
- url: https://api.us.basistheory.com
  description: US
  x-fern-server-name: us
- url: https://api.eu.basistheory.com
  description: EU
  x-fern-server-name: eu
- url: https://api.test.basistheory.com
  description: Test
  x-fern-server-name: test
security:
- ApiKey: []
tags:
- name: ApplicationTemplates
paths:
  /application-templates:
    get:
      tags:
      - ApplicationTemplates
      operationId: ApplicationTemplates_Get
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationTemplate'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-fern-sdk-group-name:
      - application_templates
      x-fern-sdk-method-name: list
      summary: Application templates get
      x-summary-source: derived
  /application-templates/{id}:
    get:
      tags:
      - ApplicationTemplates
      operationId: ApplicationTemplates_GetById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationTemplate'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-fern-sdk-group-name:
      - application_templates
      x-fern-sdk-method-name: get
      summary: Application templates get by id
      x-summary-source: derived
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    AccessRule:
      type: object
      properties:
        description:
          type:
          - string
          - 'null'
        priority:
          type:
          - integer
          - 'null'
          format: int32
        container:
          type:
          - string
          - 'null'
        transform:
          type:
          - string
          - 'null'
        conditions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Condition'
        permissions:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    Condition:
      type: object
      properties:
        attribute:
          type:
          - string
          - 'null'
        operator:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
      additionalProperties: false
    ApplicationTemplate:
      type: object
      properties:
        id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        application_type:
          type:
          - string
          - 'null'
        template_type:
          type:
          - string
          - 'null'
        is_starter:
          type: boolean
        rules:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AccessRule'
        permissions:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
  securitySchemes:
    ApiKey:
      type: apiKey
      description: Authorization by API Key inside request's BT-API-KEY header
      name: BT-API-KEY
      in: header
