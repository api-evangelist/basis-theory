openapi: 3.2.0
info:
  title: Basis Theory Token Intents API
  description: '## Getting Started

    * Sign-in to Basis Theory and go to Applications

    * Create a Basis Theory Private Application

    * All permissions should be selected

    * Paste the API Key into the `BT-API-KEY` variable'
  version: v1
servers:
- url: https://api.basistheory.com
  description: Default
  x-fern-server-name: default
- url: https://api.us.basistheory.com
  description: US
  x-fern-server-name: us
- url: https://api.eu.basistheory.com
  description: EU
  x-fern-server-name: eu
- url: https://api.test.basistheory.com
  description: Test
  x-fern-server-name: test
security:
- ApiKey: []
tags:
- name: TokenIntents
paths:
  /token-intents/{id}:
    get:
      tags:
      - TokenIntents
      operationId: TokenIntents_Read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          maxLength: 250
          pattern: ^.+$
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenIntent'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-fern-sdk-group-name:
      - token-intents
      x-fern-sdk-method-name: get
      summary: Token intents read
      x-summary-source: derived
    delete:
      tags:
      - TokenIntents
      operationId: TokenIntents_Delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/xml:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-fern-sdk-group-name:
      - token-intents
      x-fern-sdk-method-name: delete
      summary: Token intents delete
      x-summary-source: derived
  /token-intents:
    post:
      tags:
      - TokenIntents
      operationId: TokenIntents_Create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenIntentRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTokenIntentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-fern-sdk-group-name:
      - token-intents
      x-fern-sdk-method-name: create
      summary: Token intents create
      x-summary-source: derived
components:
  schemas:
    AssuranceDetails:
      type: object
      properties:
        account_verified:
          type: boolean
        card_holder_authenticated:
          type: boolean
      additionalProperties: false
    CardIssuer:
      type: object
      properties:
        country:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
      additionalProperties: false
    AdditionalCardDetails:
      type: object
      properties:
        brand:
          type:
          - string
          - 'null'
        funding:
          type:
          - string
          - 'null'
        authentication:
          type:
          - string
          - 'null'
        issuer:
          $ref: '#/components/schemas/CardIssuer'
      additionalProperties: false
    CardIssuerCountry:
      type: object
      properties:
        alpha2:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        numeric:
          type:
          - string
          - 'null'
      additionalProperties: false
    TokenIntentExtras:
      type: object
      properties:
        tsp_details:
          $ref: '#/components/schemas/TokenServiceProviderDetails'
        network_token_ids:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    TokenServiceProviderDetails:
      type: object
      properties:
        tsp:
          type:
          - string
          - 'null'
        auth_method:
          type:
          - string
          - 'null'
        message_id:
          type:
          - string
          - 'null'
        eci_indicator:
          type:
          - string
          - 'null'
        assurance_details:
          $ref: '#/components/schemas/AssuranceDetails'
        transaction_id:
          type:
          - string
          - 'null'
        currency_code:
          type:
          - string
          - 'null'
        transaction_amount:
          type:
          - integer
          - 'null'
          format: int64
        cardholder_name:
          type:
          - string
          - 'null'
        device_manufacturer_identifier:
          type:
          - string
          - 'null'
        payment_data_type:
          type:
          - string
          - 'null'
        merchant_token_identifier:
          type:
          - string
          - 'null'
        authentication_responses:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AuthenticationResponse'
        status:
          type:
          - string
          - 'null'
      additionalProperties: false
    ValidationProblemDetails:
      type: object
      properties:
        errors:
          type:
          - object
          - 'null'
          additionalProperties:
            type: array
            items:
              type: string
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    CreateTokenIntentRequest:
      required:
      - type
      type: object
      properties:
        type:
          minLength: 1
          type: string
        data: {}
        encrypted:
          type:
          - string
          - 'null'
      additionalProperties: false
    CardDetails:
      type: object
      properties:
        bin:
          type:
          - string
          - 'null'
        last4:
          type:
          - string
          - 'null'
        expiration_month:
          type:
          - integer
          - 'null'
          format: int32
        expiration_year:
          type:
          - integer
          - 'null'
          format: int32
        brand:
          type:
          - string
          - 'null'
        funding:
          type:
          - string
          - 'null'
        authentication:
          type:
          - string
          - 'null'
        issuer:
          $ref: '#/components/schemas/CardIssuer'
        issuer_country:
          $ref: '#/components/schemas/CardIssuerCountry'
        segment:
          type:
          - string
          - 'null'
        product:
          $ref: '#/components/schemas/CardProduct'
        additional:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AdditionalCardDetails'
      additionalProperties: false
    CardProduct:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
      additionalProperties: false
    BankDetails:
      type: object
      properties:
        routing_number:
          type:
          - string
          - 'null'
        account_number_last4:
          type:
          - string
          - 'null'
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    AuthenticationResponse:
      type: object
      properties:
        merchant_identifier:
          type:
          - string
          - 'null'
        authentication_data:
          type:
          - string
          - 'null'
        transaction_amount:
          type:
          - string
          - 'null'
      additionalProperties: false
    TokenIntent:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        tenant_id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        fingerprint:
          type:
          - string
          - 'null'
        created_by:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        created_at:
          maxLength: 40
          type: string
          format: date-time
        expires_at:
          maxLength: 40
          type: string
          format: date-time
        data: {}
        card:
          $ref: '#/components/schemas/CardDetails'
        bank:
          $ref: '#/components/schemas/BankDetails'
        network_token:
          $ref: '#/components/schemas/CardDetails'
        authentication: {}
        _extras:
          $ref: '#/components/schemas/TokenIntentExtras'
      additionalProperties: false
    CreateTokenIntentResponse:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        tenant_id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        fingerprint:
          type:
          - string
          - 'null'
        created_by:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        created_at:
          maxLength: 40
          type: string
          format: date-time
        expires_at:
          maxLength: 40
          type: string
          format: date-time
        data: {}
        card:
          $ref: '#/components/schemas/CardDetails'
        bank:
          $ref: '#/components/schemas/BankDetails'
        network_token:
          $ref: '#/components/schemas/CardDetails'
        authentication: {}
        _extras:
          $ref: '#/components/schemas/TokenIntentExtras'
      additionalProperties: false
  securitySchemes:
    ApiKey:
      type: apiKey
      description: Authorization by API Key inside request's BT-API-KEY header
      name: BT-API-KEY
      in: header
