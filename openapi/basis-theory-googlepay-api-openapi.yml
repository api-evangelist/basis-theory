components:
  schemas:
    CardIssuer:
      type: object
      properties:
        country:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
      additionalProperties: false
    TokenAuthentication:
      type: object
      properties:
        threeds_cryptogram:
          type:
          - string
          - 'null'
        eci_indicator:
          type:
          - string
          - 'null'
      additionalProperties: false
    TokenIntentExtras:
      type: object
      properties:
        tsp_details:
          $ref: '#/components/schemas/TokenServiceProviderDetails'
        network_token_ids:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    GooglePayMerchantCertificates:
      type: object
      properties:
        id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        tenant_id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        merchant_certificate_expiration_date:
          maxLength: 40
          type:
          - string
          - 'null'
          format: date-time
        merchant_certificate_fingerprint:
          type:
          - string
          - 'null'
        created_by:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          maxLength: 40
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
    BankDetails:
      type: object
      properties:
        routing_number:
          type:
          - string
          - 'null'
        account_number_last4:
          type:
          - string
          - 'null'
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    GooglePayMerchantRegisterRequest:
      type: object
      properties:
        merchant_identifier:
          type:
          - string
          - 'null'
      additionalProperties: false
    GooglePayMerchant:
      type: object
      properties:
        id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        tenant_id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        merchant_identifier:
          type:
          - string
          - 'null'
        created_by:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          maxLength: 40
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
    CardDetails:
      type: object
      properties:
        bin:
          type:
          - string
          - 'null'
        last4:
          type:
          - string
          - 'null'
        expiration_month:
          type:
          - integer
          - 'null'
          format: int32
        expiration_year:
          type:
          - integer
          - 'null'
          format: int32
        brand:
          type:
          - string
          - 'null'
        funding:
          type:
          - string
          - 'null'
        authentication:
          type:
          - string
          - 'null'
        issuer:
          $ref: '#/components/schemas/CardIssuer'
        issuer_country:
          $ref: '#/components/schemas/CardIssuerCountry'
        segment:
          type:
          - string
          - 'null'
        product:
          $ref: '#/components/schemas/CardProduct'
        additional:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AdditionalCardDetails'
      additionalProperties: false
    GooglePayMerchantCertificatesRegisterRequest:
      type: object
      properties:
        merchant_certificate_data:
          type:
          - string
          - 'null'
        merchant_certificate_password:
          type:
          - string
          - 'null'
      additionalProperties: false
    AuthenticationResponse:
      type: object
      properties:
        merchant_identifier:
          type:
          - string
          - 'null'
        authentication_data:
          type:
          - string
          - 'null'
        transaction_amount:
          type:
          - string
          - 'null'
      additionalProperties: false
    AssuranceDetails:
      type: object
      properties:
        account_verified:
          type: boolean
        card_holder_authenticated:
          type: boolean
      additionalProperties: false
    CardIssuerCountry:
      type: object
      properties:
        alpha2:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        numeric:
          type:
          - string
          - 'null'
      additionalProperties: false
    ValidationProblemDetails:
      type: object
      properties:
        errors:
          type:
          - object
          - 'null'
          additionalProperties:
            type: array
            items:
              type: string
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    IntermediateSigningKey:
      type: object
      properties:
        signedKey:
          type:
          - string
          - 'null'
        signatures:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    GooglePayMethodToken:
      type: object
      properties:
        protocolVersion:
          type:
          - string
          - 'null'
        signature:
          type:
          - string
          - 'null'
        intermediateSigningKey:
          $ref: '#/components/schemas/IntermediateSigningKey'
        signedMessage:
          type:
          - string
          - 'null'
      additionalProperties: false
    GooglePayToken:
      type: object
      properties:
        id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        tenant_id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        status:
          type:
          - string
          - 'null'
        expires_at:
          maxLength: 40
          type:
          - string
          - 'null'
          format: date-time
        created_by:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          maxLength: 40
          type:
          - string
          - 'null'
          format: date-time
        modified_by:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type:
          - string
          - 'null'
          format: uuid
        modified_at:
          maxLength: 40
          type:
          - string
          - 'null'
          format: date-time
        card:
          $ref: '#/components/schemas/CardDetails'
        data: {}
        authentication:
          $ref: '#/components/schemas/TokenAuthentication'
        details:
          $ref: '#/components/schemas/TokenServiceProviderDetails'
        fingerprint:
          maxLength: 100
          pattern: ^[A-z0-9]*$
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        ingest_source:
          type:
          - string
          - 'null'
      additionalProperties: false
    GooglePayCreateRequest:
      type: object
      properties:
        expires_at:
          type:
          - string
          - 'null'
        google_payment_data:
          $ref: '#/components/schemas/GooglePayMethodToken'
        merchant_registration_id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type:
          - string
          - 'null'
          format: uuid
      additionalProperties: false
    CreateTokenIntentResponse:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
        tenant_id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        fingerprint:
          type:
          - string
          - 'null'
        created_by:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        created_at:
          maxLength: 40
          type: string
          format: date-time
        expires_at:
          maxLength: 40
          type: string
          format: date-time
        data: {}
        card:
          $ref: '#/components/schemas/CardDetails'
        bank:
          $ref: '#/components/schemas/BankDetails'
        network_token:
          $ref: '#/components/schemas/CardDetails'
        authentication: {}
        _extras:
          $ref: '#/components/schemas/TokenIntentExtras'
      additionalProperties: false
    AdditionalCardDetails:
      type: object
      properties:
        brand:
          type:
          - string
          - 'null'
        funding:
          type:
          - string
          - 'null'
        authentication:
          type:
          - string
          - 'null'
        issuer:
          $ref: '#/components/schemas/CardIssuer'
      additionalProperties: false
    TokenServiceProviderDetails:
      type: object
      properties:
        tsp:
          type:
          - string
          - 'null'
        auth_method:
          type:
          - string
          - 'null'
        message_id:
          type:
          - string
          - 'null'
        eci_indicator:
          type:
          - string
          - 'null'
        assurance_details:
          $ref: '#/components/schemas/AssuranceDetails'
        transaction_id:
          type:
          - string
          - 'null'
        currency_code:
          type:
          - string
          - 'null'
        transaction_amount:
          type:
          - integer
          - 'null'
          format: int64
        cardholder_name:
          type:
          - string
          - 'null'
        device_manufacturer_identifier:
          type:
          - string
          - 'null'
