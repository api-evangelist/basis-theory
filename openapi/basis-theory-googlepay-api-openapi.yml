openapi: 3.2.0
info:
  title: Basis Theory Google Pay API
  description: '## Getting Started

    * Sign-in to Basis Theory and go to Applications

    * Create a Basis Theory Private Application

    * All permissions should be selected

    * Paste the API Key into the `BT-API-KEY` variable'
  version: v1
servers:
- url: https://api.basistheory.com
  description: Default
  x-fern-server-name: default
- url: https://api.us.basistheory.com
  description: US
  x-fern-server-name: us
- url: https://api.eu.basistheory.com
  description: EU
  x-fern-server-name: eu
- url: https://api.test.basistheory.com
  description: Test
  x-fern-server-name: test
security:
- ApiKey: []
tags:
- name: GooglePay
paths:
  /google-pay:
    post:
      tags:
      - GooglePay
      operationId: Google_Pay_Create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GooglePayCreateRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GooglePayCreateResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-fern-sdk-group-name:
      - google-pay
      x-fern-sdk-method-name: create
      summary: Google pay create
      x-summary-source: derived
  /google-pay/{id}:
    delete:
      tags:
      - GooglePay
      operationId: Google_Pay_Delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-fern-sdk-group-name:
      - google-pay
      x-fern-sdk-method-name: delete
      summary: Google pay delete
      x-summary-source: derived
    get:
      tags:
      - GooglePay
      operationId: Google_Pay_Get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GooglePayToken'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-fern-sdk-group-name:
      - google-pay
      x-fern-sdk-method-name: get
      summary: Google pay get
      x-summary-source: derived
  /google-pay/merchant-registration/{id}:
    delete:
      tags:
      - GooglePay
      operationId: Google_Pay_Merchant_Delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-fern-sdk-group-name:
      - google-pay
      - merchant
      x-fern-sdk-method-name: delete
      summary: Google pay merchant delete
      x-summary-source: derived
    get:
      tags:
      - GooglePay
      operationId: Google_Pay_Merchant_Get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GooglePayMerchant'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-fern-sdk-group-name:
      - google-pay
      - merchant
      x-fern-sdk-method-name: get
      summary: Google pay merchant get
      x-summary-source: derived
  /google-pay/merchant-registration/{merchantId}/certificates/{id}:
    delete:
      tags:
      - GooglePay
      operationId: Google_Pay_Merchant_Certificates_Delete
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-fern-sdk-group-name:
      - google-pay
      - merchant
      - certificates
      x-fern-sdk-method-name: delete
      summary: Google pay merchant certificates delete
      x-summary-source: derived
    get:
      tags:
      - GooglePay
      operationId: Google_Pay_Merchant_Certificates_Get
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GooglePayMerchantCertificates'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-fern-sdk-group-name:
      - google-pay
      - merchant
      - certificates
      x-fern-sdk-method-name: get
      summary: Google pay merchant certificates get
      x-summary-source: derived
  /google-pay/merchant-registration:
    post:
      tags:
      - GooglePay
      operationId: Google_Pay_Merchant_Register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GooglePayMerchantRegisterRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GooglePayMerchant'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-fern-sdk-group-name:
      - google-pay
      - merchant
      x-fern-sdk-method-name: create
      summary: Google pay merchant register
      x-summary-source: derived
  /google-pay/merchant-registration/{merchantId}/certificates:
    post:
      tags:
      - GooglePay
      operationId: Google_Pay_Merchant_Certificates_Create
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
