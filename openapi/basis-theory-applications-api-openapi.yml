openapi: 3.2.0
info:
  title: Basis Theory Applications API
  description: '## Getting Started

    * Sign-in to Basis Theory and go to Applications

    * Create a Basis Theory Private Application

    * All permissions should be selected

    * Paste the API Key into the `BT-API-KEY` variable'
  version: v1
servers:
- url: https://api.basistheory.com
  description: Default
  x-fern-server-name: default
- url: https://api.us.basistheory.com
  description: US
  x-fern-server-name: us
- url: https://api.eu.basistheory.com
  description: EU
  x-fern-server-name: eu
- url: https://api.test.basistheory.com
  description: Test
  x-fern-server-name: test
security:
- ApiKey: []
tags:
- name: Applications
paths:
  /applications:
    get:
      tags:
      - Applications
      operationId: Applications_Get
      parameters:
      - name: id
        in: query
        schema:
          type:
          - array
          - 'null'
          items:
            maxLength: 36
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            type: string
            format: uuid
      - name: type
        in: query
        schema:
          type:
          - array
          - 'null'
          items:
            type: string
      - name: page
        in: query
        schema:
          maximum: 2147483647
          type:
          - integer
          - 'null'
          format: int32
          exclusiveMinimum: 0
      - name: start
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: size
        in: query
        schema:
          maximum: 100
          minimum: 0
          type:
          - integer
          - 'null'
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPaginatedList'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-fern-sdk-group-name:
      - applications
      x-fern-sdk-method-name: list
      x-fern-pagination: true
      summary: Applications get
      x-summary-source: derived
    post:
      tags:
      - Applications
      operationId: Applications_Create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-fern-sdk-group-name:
      - applications
      x-fern-sdk-method-name: create
      x-fern-idempotent: true
      summary: Applications create
      x-summary-source: derived
  /applications/{id}:
    get:
      tags:
      - Applications
      operationId: Applications_GetById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-fern-sdk-group-name:
      - applications
      x-fern-sdk-method-name: get
      summary: Applications get by id
      x-summary-source: derived
    put:
      tags:
      - Applications
      operationId: Applications_Update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-fern-sdk-group-name:
      - applications
      x-fern-sdk-method-name: update
      x-fern-idempotent: true
      summary: Applications update
      x-summary-source: derived
    delete:
      tags:
      - Applications
      operationId: Applications_Delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-fern-sdk-group-name:
      - applications
      x-fern-sdk-method-name: delete
      summary: Applications delete
      x-summary-source: derived
  /applications/key:
    get:
      tags:
      - Applications
      operationId: Applications_GetByKey
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      x-fern-sdk-group-name:
      - applications
      x-fern-sdk-method-name: get_by_key
      summary: Applications get by key
      x-summary-source: derived
  /applications/{id}/regenerate:
    post:
      tags:
      - Applications
      operationId: Applications_RegenerateKey
      parameters:
      - name: id
        in: path
        required: true
        schema:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      deprecated: true
      x-fern-sdk-group-name:
      - applications
      x-fern-sdk-method-name: regenerate_key
      x-fern-idempotent: true
      x-fern-ignore: true
      summary: Applications regenerate key
      x-summary-source: derived
components:
  schemas:
    AccessRule:
      type: object
      properties:
        description:
          type:
          - string
          - 'null'
        priority:
          type:
          - integer
          - 'null'
          format: int32
        container:
          type:
          - string
          - 'null'
        transform:
          type:
          - string
          - 'null'
        conditions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Condition'
        permissions:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    UpdateApplicationRequest:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 200
          minLength: 1
          pattern: ^.+$
          type: string
        permissions:
          maxItems: 75
          type:
          - array
          - 'null'
          items:
            type: string
        rules:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AccessRule'
      additionalProperties: false
    ValidationProblemDetails:
      type: object
      properties:
        errors:
          type:
          - object
          - 'null'
          additionalProperties:
            type: array
            items:
              type: string
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    CreateApplicationRequest:
      required:
      - name
      - type
      type: object
      properties:
        name:
          maxLength: 200
          minLength: 1
          pattern: ^.+$
          type: string
        type:
          maxLength: 25
          minLength: 1
          pattern: ^[A-z_]+$
          type: string
        permissions:
          maxItems: 75
          type:
          - array
          - 'null'
          items:
            type: string
        rules:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AccessRule'
        create_key:
          type:
          - boolean
          - 'null'
      additionalProperties: false
    Application:
      type: object
      properties:
        id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        tenant_id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        name:
          maxLength: 200
          pattern: ^.+$
          type:
          - string
          - 'null'
        key:
          maxLength: 100
          pattern: '[A-z0-9_.]+'
          type:
          - string
          - 'null'
          deprecated: true
        keys:
          maxItems: 3
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ApplicationKey'
        type:
          maxLength: 50
          pattern: ^[A-z_]+$
          type:
          - string
          - 'null'
        created_by:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          maxLength: 40
          type:
          - string
          - 'null'
          format: date-time
        modified_by:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type:
          - string
          - 'null'
          format: uuid
        modified_at:
          maxLength: 40
          type:
          - string
          - 'null'
          format: date-time
        permissions:
          maxItems: 50
          type:
          - array
          - 'null'
          items:
            type: string
        rules:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AccessRule'
      additionalProperties: false
    Pagination:
      type: object
      properties:
        total_items:
          type:
          - integer
          - 'null'
          format: int32
        page_number:
          type:
          - integer
          - 'null'
          format: int32
        page_size:
          type:
          - integer
          - 'null'
          format: int32
        total_pages:
          type:
          - integer
          - 'null'
          format: int32
        after:
          type:
          - string
          - 'null'
          deprecated: true
        next:
          type:
          - string
          - 'null'
      additionalProperties: false
    ApplicationPaginatedList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        data:
          maxItems: 100
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Application'
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    Condition:
      type: object
      properties:
        attribute:
          type:
          - string
          - 'null'
        operator:
          type:
          - string
          - 'null'
        value:
          type:
          - string
          - 'null'
      additionalProperties: false
    ApplicationKey:
      type: object
      properties:
        id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        key:
          type:
          - string
          - 'null'
        version:
          type:
          - string
          - 'null'
        created_by:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          maxLength: 40
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
  securitySchemes:
    ApiKey:
      type: apiKey
      description: Authorization by API Key inside request's BT-API-KEY header
      name: BT-API-KEY
      in: header
