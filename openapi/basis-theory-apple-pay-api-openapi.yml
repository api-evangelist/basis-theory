components:
  schemas:
    CardIssuer:
      type: object
      properties:
        country:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
      additionalProperties: false
    ApplePayDomainDeregistrationRequest:
      required:
      - domain
      type: object
      properties:
        domain:
          minLength: 1
          type: string
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    ApplePayMerchantRegisterRequest:
      type: object
      properties:
        merchant_identifier:
          type:
          - string
          - 'null'
      additionalProperties: false
    ApplePayCreateRequest:
      type: object
      properties:
        expires_at:
          type:
          - string
          - 'null'
        apple_payment_data:
          $ref: '#/components/schemas/ApplePayMethodToken'
        merchant_registration_id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type:
          - string
          - 'null'
          format: uuid
      additionalProperties: false
    ApplePaySessionRequest:
      type: object
      properties:
        validation_url:
          type:
          - string
          - 'null'
        display_name:
          type:
          - string
          - 'null'
        domain:
          type:
          - string
          - 'null'
        merchant_registration_id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type:
          - string
          - 'null'
          format: uuid
      additionalProperties: false
    CardDetails:
      type: object
      properties:
        bin:
          type:
          - string
          - 'null'
        last4:
          type:
          - string
          - 'null'
        expiration_month:
          type:
          - integer
          - 'null'
          format: int32
        expiration_year:
          type:
          - integer
          - 'null'
          format: int32
        brand:
          type:
          - string
          - 'null'
        funding:
          type:
          - string
          - 'null'
        authentication:
          type:
          - string
          - 'null'
        issuer:
          $ref: '#/components/schemas/CardIssuer'
        issuer_country:
          $ref: '#/components/schemas/CardIssuerCountry'
        segment:
          type:
          - string
          - 'null'
        product:
          $ref: '#/components/schemas/CardProduct'
        additional:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AdditionalCardDetails'
      additionalProperties: false
    ApplePayMerchantCertificates:
      type: object
      properties:
        id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
