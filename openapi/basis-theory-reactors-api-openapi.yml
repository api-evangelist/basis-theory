      x-fern-sdk-group-name:
      - reactors
      - results
      x-fern-sdk-method-name: get
      summary: Reactors result get by id
      x-summary-source: derived
components:
  schemas:
    AccessRule:
      type: object
      properties:
        description:
          type:
          - string
          - 'null'
        priority:
          type:
          - integer
          - 'null'
          format: int32
        container:
          type:
          - string
          - 'null'
        transform:
          type:
          - string
          - 'null'
        conditions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Condition'
        permissions:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
    Application:
      type: object
      properties:
        id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        tenant_id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        name:
          maxLength: 200
          pattern: ^.+$
          type:
          - string
          - 'null'
        key:
          maxLength: 100
          pattern: '[A-z0-9_.]+'
          type:
          - string
          - 'null'
          deprecated: true
        keys:
          maxItems: 3
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ApplicationKey'
        type:
          maxLength: 50
          pattern: ^[A-z_]+$
          type:
          - string
          - 'null'
        created_by:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          maxLength: 40
          type:
          - string
          - 'null'
          format: date-time
        modified_by:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type:
          - string
          - 'null'
          format: uuid
        modified_at:
          maxLength: 40
          type:
          - string
          - 'null'
          format: date-time
        permissions:
          maxItems: 50
          type:
          - array
          - 'null'
          items:
            type: string
        rules:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AccessRule'
      additionalProperties: false
    RequestedReactor:
      type: object
      properties:
        reactor:
          $ref: '#/components/schemas/PendingReactor'
        error_code:
          type:
          - string
          - 'null'
        error_message:
          type:
          - string
          - 'null'
        error_details:
          type:
          - object
          - 'null'
          additionalProperties: {}
      additionalProperties: false
    ReactorFormula:
      type: object
      properties:
        id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        type:
          maxLength: 25
          pattern: ^(?:private|official)$
          type:
          - string
          - 'null'
        status:
          maxLength: 25
          pattern: ^(?:verified|coming_soon)$
          type:
          - string
          - 'null'
        name:
          maxLength: 200
          pattern: ^.+$
          type:
          - string
          - 'null'
        description:
          maxLength: 1000
          pattern: ^[\S\s]*$
          type:
          - string
          - 'null'
        icon:
          maxLength: 50000
          pattern: (^data:(image\/png|image\/jpg|image\/jpeg|image\/svg\+xml);\s*base64,\s*(?:[A-Za-z0-9+\/]{4})*(?:[A-Za-z0-9+\/]{2}==|[A-Za-z0-9+\/]{3}=|[A-Za-z0-9+\/]{4})$)|(^data:(image\/png|image\/jpg|image\/jpeg);\s*base64,\s*(?:[A-Za-z0-9+\/]{4})*(?:[A-Za-z0-9+\/]{2}==|[A-Za-z0-9+\/]{3}=|[A-Za-z0-9+\/]{4})$)
          type:
          - string
          - 'null'
        code:
          maxLength: 4000
          pattern: ^[\S\s]*$
          type:
          - string
          - 'null'
        created_by:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          maxLength: 40
          type:
          - string
          - 'null'
          format: date-time
        modified_by:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type:
          - string
          - 'null'
          format: uuid
        modified_at:
          maxLength: 40
          type:
          - string
          - 'null'
          format: date-time
        configuration:
          maxItems: 25
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ReactorFormulaConfiguration'
        request_parameters:
          maxItems: 25
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ReactorFormulaRequestParameter'
      additionalProperties: false
      deprecated: true
    AsyncReactResponse:
      type: object
      properties:
        asyncReactorRequestId:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    PendingReactor:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
        runtime:
          $ref: '#/components/schemas/ReactorRuntime'
        configuration:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
      additionalProperties: false
    RuntimeLogOptions:
      type: object
      properties:
        enabled:
          type:
          - boolean
          - 'null'
        level:
          type:
          - string
          - 'null'
      additionalProperties: false
    ReactorPaginatedList:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        data:
          maxItems: 100
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Reactor'
      additionalProperties: false
    ReactResponse:
      type: object
      properties:
        tokens: {}
        raw: {}
        body: {}
        headers: {}
      additionalProperties: false
    ApplicationKey:
      type: object
      properties:
        id:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type: string
          format: uuid
        key:
          type:
          - string
          - 'null'
        version:
          type:
          - string
          - 'null'
        created_by:
          maxLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          maxLength: 40
          type:
          - string
          - 'null'
          format: date-time
      additionalProperties: false
    CreateReactorRequest:
      required:
      - code
      - name
      type: object
      properties:
        name:
          maxLength: 200
          minLength: 1
          pattern: ^.+$
          type: string
        code:
          maxLength: 50000
          minLength: 1
          pattern: ^[\S\s]*$
          type: string
        application:
          $ref: '#/components/schemas/Application'
        configuration:
          maxLength: 25
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
        runtime:
          $ref: '#/components/schemas/ReactorRuntime'
      additionalProperties: false
    ReactorRuntime:
      type: object
      properties:
        async:
          type:
          - boolean
          - 'null'
        image:
          type:
          - string
          - 'null'
        dependencies:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
        resolutions:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
        warm_concurrency:
          type:
          - integer
          - 'null'
          format: int32
        timeout:
          type:
          - integer
          - 'null'
          format: int32
        resources:
          type:
          - string
          - 'null'
        permissions:
          type:
          - array
          - 'null'
          items:
