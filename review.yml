aid: basis-theory
name: Basis Theory
review:
  question: Does Basis Theory expose a documented public WebSocket API?
  answer: false
  date: '2026-06-20'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    Per API Evangelist scope, AsyncAPI is authored only for documented
    event-driven transports (WebSocket, SSE, or message brokers). Basis
    Theory delivers asynchronous notifications via HTTP webhooks - the
    platform POSTs event payloads to tenant-registered URLs - which is a
    server-to-client HTTP callback pattern, not a streaming transport. No
    AsyncAPI document was created because no WebSocket or SSE surface is
    documented. The webhook surface is modeled in the OpenAPI document as
    REST management endpoints under /webhooks.
findings:
  summary: |
    Basis Theory does not publish a documented public WebSocket API. The
    platform is a PCI-compliant tokenization and data vault exposing REST
    (HTTPS) endpoints under https://api.basistheory.com (and
    https://api.test.basistheory.com for TEST tenants), authenticated with
    the BT-API-KEY request header. Asynchronous behavior is delivered two
    ways, neither of which is WebSocket: (1) outbound webhooks, where Basis
    Theory POSTs event payloads to tenant-registered URLs (up to five per
    tenant), managed via REST CRUD under /webhooks; and (2) asynchronous
    Reactor invocation, which is still initiated over REST. No realtime,
    bidirectional ws:// or wss:// endpoint is documented for tokens, proxy,
    reactors, 3DS, or any other product surface.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.basistheory.com
      documented: true
    - protocol: Webhooks
      scheme: https
      note: Outbound HTTP callbacks POSTed by Basis Theory to tenant-registered URLs. Not WebSocket; not client-initiated streaming.
      documented: true
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in Basis Theory's API reference for any product as of the review date.
