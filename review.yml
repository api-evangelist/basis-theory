sources:
  - url: https://developers.basistheory.com/docs/api/
    type: Documentation
    note: API overview lists REST base URLs and JSON request/response conventions; no WebSocket mentioned.
  - url: https://developers.basistheory.com/docs/api/tokens
    type: APIReference
    note: Token CRUD, tokenize, and detokenize are all HTTPS REST endpoints.
  - url: https://developers.basistheory.com/docs/api/proxies
    type: APIReference
    note: Proxy (pre-configured and ephemeral) is invoked over REST via the /proxy endpoint; detokenization happens inline.
  - url: https://developers.basistheory.com/docs/api/webhooks/api
    type: APIReference
    note: Asynchronous notifications use outbound HTTP webhooks, not WebSocket; managed via REST CRUD.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket or SSE protocol surface exists. Asynchronous behavior is
    delivered via outbound HTTP webhooks, which are modeled as REST
    management endpoints in the OpenAPI document. No AsyncAPI artifact was
    authored because there is no documented streaming or message-broker
    transport to model.
